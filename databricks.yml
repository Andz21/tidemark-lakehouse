# This is a Declarative Automation Bundle definition for temp.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: temp
  uuid: 455ff9d8-0691-4f6b-8461-c49914c68614

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405612879064564.4.azuredatabricks.net?w=7405612879064564
    variables:
      catalog: tidemark_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405612879064564.4.azuredatabricks.net?w=7405612879064564
      # We explicitly deploy to /Workspace/Users/andria2191@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/andria2191@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: tidemark_prod
      schema: prod
    permissions:
      - user_name: andria2191@outlook.com
        level: CAN_MANAGE
